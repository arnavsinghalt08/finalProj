<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <title>Animated Solar System</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <a class="home-btn" href="../index.html" title="Home">Home</a>
    <div class="star-bg">
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
    </div>

    <h1 style="font-family: 'Audiowide', sans-serif;">The Solar System</h1>

    <div class="solar-system">
        <div class="sun" data-planet="sun"></div>

        <div class="orbit" id="mercury-orbit">
            <div class="planet" id="mercury" data-planet="mercury"></div>
        </div>
        <div class="orbit" id="venus-orbit">
            <div class="planet" id="venus" data-planet="venus"></div>
        </div>
        <div class="orbit" id="earth-orbit">
            <div class="planet" id="earth" data-planet="earth">
                <div class="moon"></div>
            </div>
        </div>
        <div class="orbit" id="mars-orbit">
            <div class="planet" id="mars" data-planet="mars"></div>
        </div>
        <div class="orbit" id="jupiter-orbit">
            <div class="planet" id="jupiter" data-planet="jupiter"></div>
        </div>
        <div class="orbit" id="saturn-orbit">
            <div class="planet" id="saturn" data-planet="saturn">
                <div class="ring"></div>
            </div>
        </div>
        <div class="orbit" id="uranus-orbit">
            <div class="planet" id="uranus" data-planet="uranus"></div>
        </div>
        <div class="orbit" id="neptune-orbit">
            <div class="planet" id="neptune" data-planet="neptune"></div>
        </div>
    </div>

    <div id="info-box" class="hidden">
        <h2 id="info-title"></h2>
        <div id="info-stats" class="info-stats-grid"></div>
        <p id="info-fact"></p>
    </div>
    
    <script src="./script.js"></script>
</body>
</html>
